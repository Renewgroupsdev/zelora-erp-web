<div class="treatment-page container-fluid px-0 d-flex flex-column">

  <div class="page-header d-flex align-items-center justify-content-between">
    <h6 class="page-title"><i class="bi bi-heart-pulse-fill"></i> Treatment Management</h6>

    <div class="page-header-actions">
      <span class="today-date-badge"><i class="bi bi-grid-3x3-gap"></i> {{ store.treatments().length }} treatments</span>

      <button type="button" class="add-treatment-btn" (click)="create()">
        <i class="bi bi-plus-lg"></i> <span>Create Treatment</span>
      </button>
    </div>
  </div>

  <div class="row g-2 g-md-3 stat-row">
    @for (stat of stats(); track stat.label) {
      <div class="col-6 col-md">
        <app-common-detail-card
          [label]="stat.label"
          [value]="stat.value"
          [icon]="stat.icon"
          [iconVariant]="stat.iconVariant ?? 'primary'"
        ></app-common-detail-card>
      </div>
    }
  </div>

  <app-common-filter-card
    searchPlaceholder="Search treatment by name or description"
    [filters]="filters"
    (searchChange)="onSearch($event)"
    (filterClick)="onFilterClick($event)"
    (filtersChange)="onFiltersChange($event)"
    (exportClick)="onExport()"
  ></app-common-filter-card>

  <div class="table-col">
    <app-common-table-card
      title="All Treatments"
      [recordCountText]="recordCountText()"
      [columns]="columns"
      [rows]="rows()"
      [totalRecords]="totalRecords()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      [currentPage]="currentPage()"
      [pageInfoText]="pageInfoText()"
      [sortActive]="sortActive()"
      [sortDirection]="sortDirection()"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (quickActionClick)="onQuickAction($event)"
    ></app-common-table-card>
  </div>

</div>
