<div class="treatment-page">
  <div class="page-heading">
    <div>
      <span class="eyebrow"><i class="bi bi-heart-pulse"></i> Treatment Master</span>
      <h1>Treatment Management</h1>
      <p>Manage all treatment services, packages, combos, pricing, GST, sittings and consumables.</p>
    </div>
    <button class="btn primary" type="button" (click)="create()"><i class="bi bi-plus-lg"></i> Create Treatment</button>
  </div>

  <div class="row g-2 g-md-3 stat-row">
    @for (stat of stats(); track stat.label) {
      <div class="col-6 col-md">
        <app-common-detail-card
          [label]="stat.label"
          [value]="stat.value"
          [icon]="stat.icon"
          [iconVariant]="stat.iconVariant ?? 'primary'"
        ></app-common-detail-card>
      </div>
    }
  </div>

  <section class="card list-card">
    <div class="toolbar">
      <div class="category-tabs">
        @for (cat of categories; track cat) {
          <button type="button" [class.active]="cat === category()" (click)="setCategory(cat)">
            <i class="bi" [class.bi-scissors]="cat === 'Hair'" [class.bi-stars]="cat === 'Skin'" [class.bi-person-walking]="cat === 'Slimming'"></i>
            {{ cat }} <span>{{ categoryCount(cat) }}</span>
          </button>
        }
      </div>
      <label class="search"><i class="bi bi-search"></i><input [ngModel]="search()" (ngModelChange)="onSearchChange($event)" placeholder="Search treatment..." /></label>
    </div>

    <app-common-table-card
      [recordCountText]="recordCountText()"
      [columns]="columns"
      [rows]="rows()"
      [totalRecords]="totalRecords()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      [currentPage]="currentPage()"
      [pageInfoText]="pageInfoText()"
      (pageChange)="onPageChange($event)"
      (quickActionClick)="onQuickAction($event)"
    ></app-common-table-card>
  </section>
</div>
