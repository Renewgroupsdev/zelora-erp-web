<div class="leads-page container-fluid px-0 d-flex flex-column">

  <div class="page-header d-flex align-items-center justify-content-between">
    <h6 class="page-title"><i class="bi bi-person-lines-fill"></i> Lead Management</h6>

    <button type="button" class="add-lead-btn" (click)="openAddPopup()">
      <i class="bi bi-plus-lg"></i> <span>Add Lead</span>
    </button>
  </div>

  <div class="row g-2 g-md-3 stat-row">
    @for (stat of stats; track stat.label) {
      <div class="col-6 col-md">
        <app-common-detail-card
          [label]="stat.label"
          [value]="stat.value"
          [trendText]="stat.trendText"
          [trendDirection]="stat.trendDirection ?? 'neutral'"
          [hero]="stat.label === 'Conversion Rate'"
        ></app-common-detail-card>
      </div>
    }
  </div>

  <app-common-filter-card
    searchPlaceholder="Search by name, phone or lead ID"
    [filters]="filters"
    (searchChange)="onSearch($event)"
    (filterClick)="onFilterClick($event)"
    (filtersChange)="onFiltersChange($event)"
    (exportClick)="onExport()"
  ></app-common-filter-card>

  <div class="tables-row d-flex flex-column">
    <div class="table-col">
      <app-common-table-card
        [recordCountText]="recordCountText"
        bulkActionsLabel="Bulk actions"
        [columns]="columns"
        [rows]="rows"
        [totalRecords]="totalRecords"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        [currentPage]="currentPage"
        [pageInfoText]="pageInfoText"
        [sortActive]="sortActive"
        [sortDirection]="sortDirection"
        [dragDropEnabled]="true"
        [dropListId]="ALL_LEADS_DROP_LIST_ID"
        [connectedTo]="FOLLOW_UP_DROP_LIST_ID"
        (rowReorder)="onRowReorder($event)"
        (rowTransfer)="onRowTransfer($event)"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowActionClick)="onRowAction($event)"
        (appointmentClick)="openAppointment($event)"
        (followUpClick)="openFollowUp($event)"
        (sendToBranchClick)="sendToBranch($event)"
        (editClick)="onEditLead($event)"
        (deleteClick)="onDeleteLead($event)"
      ></app-common-table-card>
    </div>

      <app-common-table-card
        recordCountText="Drag a lead here to flag it for follow-up"

        [rows]="followUpRows"

      ></app-common-table-card>
    </div> -->
  </div>

</div>
