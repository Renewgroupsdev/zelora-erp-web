<div class="followups-page container-fluid px-0 d-flex flex-column">

  <div class="page-header d-flex align-items-center justify-content-between">
    <h6 class="page-title"><i class="bi bi-arrow-repeat"></i> Follow-Ups</h6>
  </div>

  <app-auto-module-tabs></app-auto-module-tabs>

  <div class="row g-2 g-md-3 stat-row">
    @for (stat of stats; track stat.label) {
      <div class="col-6 col-md">
        <app-common-detail-card
          [label]="stat.label"
          [value]="stat.value"
          [trendText]="stat.trendText"
          [trendDirection]="stat.trendDirection ?? 'neutral'"
          [icon]="stat.icon"
          [iconVariant]="stat.iconVariant ?? 'primary'"
        ></app-common-detail-card>
      </div>
    }
  </div>

  <app-common-filter-card
    searchPlaceholder="Search by name, phone, branch or telecaller"
    [filters]="filters"
    (searchChange)="onSearch($event)"
    (filterClick)="onFilterClick($event)"
    (filtersChange)="onFiltersChange($event)"
    [showExport]="false"
  ></app-common-filter-card>

  <div class="table-col">
    <app-common-table-card historyType="CustomerLead"
      title="Follow-Ups"
      [recordCountText]="recordCountText"
      [columns]="columns"
      [rows]="rows"
      [loading]="loading"
      [totalRecords]="totalRecords"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [currentPage]="currentPage"
      [pageInfoText]="pageInfoText"
      [sortActive]="sortActive"
      [sortDirection]="sortDirection"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (rowActionClick)="onRowAction($event)"
      (quickActionClick)="onQuickAction($event)"
      (profileClick)="viewLead($event)"
    >
      @if (can('export-follow-ups')) {
        <div tableActions class="export-wrapper">
          <button type="button" class="export-btn" [class.active]="exportMenuOpen" (click)="exportMenuOpen = !exportMenuOpen; $event.stopPropagation()">
            Export <i class="bi bi-box-arrow-down"></i>
          </button>
          @if (exportMenuOpen) {
            <div class="export-menu" (click)="$event.stopPropagation()">
              <div class="export-menu-title">Export as</div>
              @for (option of exportOptions; track option.format) {
                <button type="button" class="export-option" (click)="onExport(option.format)">
                  <i class="bi" [ngClass]="option.icon"></i> {{ option.label }}
                </button>
              }
            </div>
          }
        </div>
      }
    </app-common-table-card>
  </div>

</div>
