<div class="purchase-page container-fluid px-0">

  <div class="page-header d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between">
    <div>
      <h6 class="page-title"><i class="bi bi-people-fill"></i> Employees</h6>
      <p class="page-subtitle">Employee master with full profile, salary, attendance, leave, payslips and appraisals.</p>
    </div>
    <div class="header-actions">
      <button type="button" class="ghost-btn" (click)="exportExcel()"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
      <button type="button" class="add-lead-btn" (click)="addEmployee()"><i class="bi bi-plus-lg"></i> Add Employee</button>
    </div>
  </div>

  <app-module-tabs [tabs]="tabs()" label="HR Management"></app-module-tabs>

  <div class="row g-2 stat-row">
    @for (stat of stats(); track stat.label) {
      <div class="col-6 col-md-3">
        <app-common-detail-card [label]="stat.label" [value]="stat.value" [icon]="stat.icon" [iconVariant]="stat.iconVariant ?? 'primary'"></app-common-detail-card>
      </div>
    }
  </div>

  <app-common-filter-card
    searchPlaceholder="Search by name, code, designation or mobile"
    [filters]="filters"
    [showExport]="false"
    (searchChange)="onSearch($event)"
    (filtersChange)="onFiltersChange($event)"
  ></app-common-filter-card>

  <div class="table-col">
    <app-common-table-card
      [recordCountText]="recordCountText"
      [columns]="columns"
      [rows]="rows"
      [totalRecords]="totalRecords"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [currentPage]="currentPage"
      [pageInfoText]="pageInfoText"
      [sortActive]="sortActive"
      [sortDirection]="sortDirection"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (quickActionClick)="onQuickAction($event)"
      (profileClick)="openProfile($event)"
    ></app-common-table-card>
  </div>
</div>
