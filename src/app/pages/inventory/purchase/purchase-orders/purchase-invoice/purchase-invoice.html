@let o = order();
<div class="lead-modal">

  <div class="modal-header-custom">
    <div class="modal-title-wrap">
      <div class="title-icon"><i class="bi bi-receipt-cutoff"></i></div>
      <div class="title-content">
        <h2>Purchase Order &amp; Invoice</h2>
        <p>{{ o.poNo }} · {{ o.invoiceNo }}</p>
      </div>
    </div>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="close()"><i class="bi bi-x-lg"></i></button>
  </div>

  <div class="modal-body-custom invoice-body">
    @if (loading()) {
      <div class="pdf-state"><i class="bi bi-arrow-repeat pdf-spin"></i> Loading the invoice…</div>
    } @else if (failed()) {
      <div class="pdf-state pdf-error">
        <i class="bi bi-exclamation-triangle"></i> The invoice could not be loaded.
        <button type="button" class="link-btn" (click)="load()">Try again</button>
      </div>
    } @else {
      <iframe class="pdf-frame" [src]="pdfUrl()!" title="Purchase order invoice {{ o.invoiceNo }}"></iframe>
    }
  </div>

  <div class="modal-footer-custom">
    <button type="button" class="cancel-btn" (click)="close()">Close</button>
    <button *appCan="'download-purchase-order'; let action" type="button" class="save-btn" [disabled]="loading() || failed()" (click)="downloadPdf()"><i [class]="'bi ' + (action.logo || 'bi-file-earmark-pdf')"></i> {{ action.action_name || 'Download PDF' }}</button>
  </div>
</div>
