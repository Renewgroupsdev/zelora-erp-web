<div class="purchase-page container-fluid px-0">

  <div class="page-header d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between">
    <div>
      <h6 class="page-title"><i class="bi bi-boxes"></i> Stock &amp; Transfer</h6>
      <p class="page-subtitle">Batch-wise stock in the central store and branch stores. Transfers stay in transit until the receiving store accepts them.</p>
    </div>
    <div class="header-actions">
      <div class="segment" role="tablist" aria-label="Stock view">
        <button type="button" role="tab" [class.active]="view() === 'stock'" [attr.aria-selected]="view() === 'stock'" (click)="setView('stock')">Stock</button>
        <button type="button" role="tab" [class.active]="view() === 'transfers'" [attr.aria-selected]="view() === 'transfers'" (click)="setView('transfers')">Transfers @if (purchase.openTransfers().length) { <span class="count">{{ purchase.openTransfers().length }}</span> }</button>
      </div>
      <button *appCan="'transfer-stock'; let action" type="button" class="add-lead-btn" (click)="openTransfer()"><i [class]="'bi ' + (action.logo || 'bi-arrow-left-right')"></i> {{ action.action_name || 'Transfer Stock' }}</button>
    </div>
  </div>

  <app-purchase-tabs></app-purchase-tabs>



  <div class="row g-2 stat-row">
    @for (stat of stats(); track stat.label) {
      <div class="col-6 col-md-3">
        <app-common-detail-card [label]="stat.label" [value]="stat.value" [icon]="stat.icon" [iconVariant]="stat.iconVariant ?? 'primary'"></app-common-detail-card>
      </div>
    }
  </div>

  <!-- Re-created per view so its selections reset along with the page filters. -->
  @for (v of [view()]; track v) {
    <app-common-filter-card
      searchPlaceholder="Search by product, code, batch or store"
      [filters]="pageFilters()"
      [showExport]="false"
      (searchChange)="onSearch($event)"
      (filtersChange)="onFiltersChange($event)"
    ></app-common-filter-card>
  }

  <div class="table-col">
    <app-common-table-card [historyType]="view() === 'transfers' ? 'StockTransfer' : 'StockBatch'"
      [recordCountText]="recordCountText"
      [columns]="columns"
      [loading]="purchase.loading()"
      [rows]="rows"
      [totalRecords]="totalRecords"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [currentPage]="currentPage"
      [pageInfoText]="pageInfoText"
      [sortActive]="sortActive"
      [sortDirection]="sortDirection"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      [actionPermissions]="{ transfer: 'transfer-stock' }"
      (quickActionClick)="onQuickAction($event)"
    ></app-common-table-card>
  </div>
</div>
