<main class="notfound-wrapper">
  <app-auth-background></app-auth-background>

  <div class="notfound-stack">
    <section class="notfound-card" aria-label="Page not found">
      <div class="logo-shell">
        <img src="assets/Renew-plus-logo.jpg" alt="Renew Plus Hair and Skin Care" class="notfound-logo" />
      </div>

      <span class="notfound-code">404</span>
      <h1 class="notfound-title">Page not found</h1>
      <p class="notfound-subtitle">The page you're looking for doesn't exist or you don't have access to it.</p>

      <button type="button" class="notfound-cta-btn" (click)="goHome()">
        <span>Back to safety</span>
        <i class="bi bi-arrow-right" aria-hidden="true"></i>
      </button>
    </section>
  </div>
</main>
