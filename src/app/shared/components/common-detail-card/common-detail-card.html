<div class="detail-card" [class.hero]="hero" [class.has-icon]="!!icon" [class.has-badge]="ring !== null && ring !== undefined"
     [ngClass]="'variant-' + (hero ? 'gold' : iconVariant)">
  @if (icon) {
    <!-- large faint copy of the icon behind the card -->
    <i class="bi detail-mark" [ngClass]="icon" aria-hidden="true"></i>

    <span class="detail-ring" [attr.title]="ringValue !== null ? ringValue + '%' : null">
      <svg viewBox="0 0 52 52" aria-hidden="true" focusable="false">
        <circle class="detail-ring-track" cx="26" cy="26" r="22" />
        @if (ringValue !== null) {
          <circle class="detail-ring-arc" cx="26" cy="26" r="22" pathLength="100" [attr.stroke-dasharray]="ringValue + ' 100'" transform="rotate(-90 26 26)" />
        }
      </svg>
      <span class="detail-icon"><i class="bi" [ngClass]="icon"></i></span>
    </span>
  }

  <div class="detail-card-main">
    <span class="detail-label" [attr.title]="label">{{ label }}</span>
    <span class="detail-value">{{ value }}</span>

    @if (trendText) {
      <span class="detail-trend" [ngClass]="'trend-' + trendDirection" [attr.title]="trendText">
        @if (trendDirection === 'up') {
          <i class="bi bi-arrow-up-short"></i>
        }
        @if (trendDirection === 'down') {
          <i class="bi bi-arrow-down-short"></i>
        }
        <span class="detail-trend-text">{{ trendText }}</span>
      </span>
    }
  </div>

  @if (ringValue !== null) { <span class="detail-badge">{{ ringValue }}%</span> }
</div>
