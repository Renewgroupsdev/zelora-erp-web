<div class="splash-background" aria-hidden="true">
  <!-- Soft background lighting -->
  <div class="background-orb background-orb--top"></div>
  <div class="background-orb background-orb--right"></div>
  <div class="background-dot background-dot--left"></div>
  <div class="background-dot background-dot--right"></div>
  <div class="background-dot background-dot--tiny"></div>

  <!-- Exact-style botanical corner artwork -->
  <svg class="leaf-art" viewBox="0 0 330 300" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="leafA" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#5c1532"/>
        <stop offset=".48" stop-color="#9c2a58"/>
        <stop offset="1" stop-color="#d98aa6"/>
      </linearGradient>
      <linearGradient id="leafB" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#8a2450"/>
        <stop offset="1" stop-color="#e3a0b8"/>
      </linearGradient>
      <linearGradient id="leafC" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#c0587f"/>
        <stop offset="1" stop-color="#f0c4d4"/>
      </linearGradient>
    </defs>
    <path d="M-28 245 C54 218 83 156 135 107 C183 62 231 35 302 25" fill="none" stroke="#8a2450" stroke-opacity=".42" stroke-width="5" stroke-linecap="round"/>
    <path d="M34 218 C20 166 36 112 76 73 C81 125 66 174 34 218Z" fill="url(#leafA)" opacity=".92"/>
    <path d="M77 174 C91 116 134 72 190 57 C168 116 128 158 77 174Z" fill="url(#leafB)" opacity=".76"/>
    <path d="M119 124 C144 67 188 32 244 29 C216 83 173 114 119 124Z" fill="url(#leafC)" opacity=".72"/>
    <path d="M159 82 C189 31 228 7 278 12 C253 52 212 75 159 82Z" fill="url(#leafB)" opacity=".56"/>
    <path d="M2 253 C33 226 67 223 101 238 C74 270 35 277 2 253Z" fill="url(#leafA)" opacity=".52"/>
    <path d="M18 214 C37 183 58 166 84 154" fill="none" stroke="#f0c4d4" stroke-opacity=".52" stroke-width="2"/>
  </svg>

  <!-- Handwritten-style upper-right message -->
  <div class="corner-tagline">
    <span>Healthy Hair</span>
    <span>Glowing Skin</span>
    <svg viewBox="0 0 190 22" preserveAspectRatio="none">
      <path d="M7 12 C53 21 128 22 183 5"/>
    </svg>
  </div>

  <!-- Two wave layers that start apart on the left and merge into one wave from the middle onward -->
  <svg class="splash-waves" viewBox="0 0 1774 440" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="waveLightShade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#d97fa3"/>
        <stop offset="1" stop-color="#b0406f"/>
      </linearGradient>
      <linearGradient id="waveDarkShade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8a2450"/>
        <stop offset="1" stop-color="#5c1532"/>
      </linearGradient>
    </defs>

    <!-- Shade 1: lighter back wave (only visible above the front wave, left of the merge point) -->
    <path d="M0 120 C190 120 380 205 600 262 C760 303 830 312 900 312 C1100 312 1300 230 1500 165 C1610 130 1700 122 1774 128 L1774 440 L0 440 Z" fill="url(#waveLightShade)"/>

    <!-- Shade 2: deeper front wave - rises to meet the back wave at x=900, then shares its exact crest -->
    <path d="M0 226 C200 232 400 290 600 312 C740 328 820 312 900 312 C1100 312 1300 230 1500 165 C1610 130 1700 122 1774 128 L1774 440 L0 440 Z" fill="url(#waveDarkShade)"/>
  </svg>

  <!-- Medical plus decorations -->
  <div class="medical-pluses">
    <span class="medical-plus medical-plus--1"></span>
    <span class="medical-plus medical-plus--2"></span>
    <span class="medical-plus medical-plus--3"></span>
    <span class="medical-plus medical-plus--4"></span>
    <span class="medical-plus medical-plus--5"></span>
    <span class="medical-plus medical-plus--6"></span>
    <span class="medical-plus medical-plus--7"></span>
  </div>
</div>
