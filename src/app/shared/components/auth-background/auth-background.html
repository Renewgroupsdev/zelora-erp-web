<div class="auth-bg" aria-hidden="true">
  <!-- Shared leaf shape + gradients, reused by every leaf below -->
  <svg class="bg-defs" width="0" height="0" focusable="false">
    <defs>
      <!-- Glossy natural leaf green: bright upper half, deep lower half -->
      <linearGradient id="abLeafDark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3f9055"/>
        <stop offset=".45" stop-color="#1f663c"/>
        <stop offset="1" stop-color="#0f4127"/>
      </linearGradient>
      <linearGradient id="abLeafLight" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7cc083"/>
        <stop offset=".5" stop-color="#3f8f55"/>
        <stop offset="1" stop-color="#226b3e"/>
      </linearGradient>
      <radialGradient id="abLeafGloss" cx=".45" cy=".3" r=".55">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
        <stop offset=".55" stop-color="#ffffff" stop-opacity=".1"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="abLeafFold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a3320" stop-opacity="0"/>
        <stop offset="1" stop-color="#0a3320" stop-opacity=".3"/>
      </linearGradient>
      <linearGradient id="abWave" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1f7a5c"/>
        <stop offset=".55" stop-color="#0f5a45"/>
        <stop offset="1" stop-color="#083d2f"/>
      </linearGradient>
      <!-- Broad oval leaf: rounded base at (2,30), pointed tip at (118,28) -->
      <symbol id="abLeaf" viewBox="0 0 120 60" overflow="visible">
        <path d="M2 30 C8 10 34 2 62 3 C88 4 108 14 118 28 C106 44 84 56 58 57 C30 58 8 48 2 30Z"/>
        <!-- darker lower half: the leaf folds along the midrib -->
        <path d="M2 30 C30 33 76 32 118 28 C106 44 84 56 58 57 C30 58 8 48 2 30Z" fill="url(#abLeafFold)"/>
        <!-- glossy highlight -->
        <path d="M2 30 C8 10 34 2 62 3 C88 4 108 14 118 28 C106 44 84 56 58 57 C30 58 8 48 2 30Z" fill="url(#abLeafGloss)"/>
        <path d="M4 30 C34 32 78 31 116 28" fill="none" stroke="#e6f5e8" stroke-opacity=".6" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M30 31 C38 24 46 17 54 11 M52 31 C60 24 68 17 78 12 M74 30 C82 24 90 19 98 16 M36 32 C44 39 52 45 60 50 M60 32 C68 38 76 44 84 47" fill="none" stroke="#e6f5e8" stroke-opacity=".22" stroke-width=".9" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- Soft white silk curves -->
  <svg class="bg-silk" viewBox="0 0 1440 900" preserveAspectRatio="none">
    <path d="M0 330 C210 300 390 190 560 0 L0 0Z" fill="#ffffff" fill-opacity=".55"/>
    <path d="M0 610 C190 560 330 430 400 250 C360 470 210 640 0 720Z" fill="#ffffff" fill-opacity=".5"/>
    <path d="M0 790 C280 720 560 760 820 900 L0 900Z" fill="#e2efe9" fill-opacity=".75"/>
    <path d="M900 0 C1040 120 1220 150 1440 120 L1440 0Z" fill="#ffffff" fill-opacity=".45"/>
  </svg>

  <!-- Top-left leafy branch -->
  <svg class="branch branch--top-left" viewBox="0 0 380 300">
    <!-- twig: from the left edge, through the leaves, curving up toward the top -->
    <path d="M-10 168 C30 150 62 128 92 104 C140 66 200 30 300 -4" fill="none" stroke="#3d7f57" stroke-opacity=".7" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M62 128 C70 110 76 94 80 74 M44 140 C30 142 18 145 8 148" fill="none" stroke="#3d7f57" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
    <g fill="url(#abLeafDark)">
      <!-- large leaf up and to the right -->
      <use href="#abLeaf" width="120" height="60" transform="translate(92 104) rotate(-34) scale(1.3) translate(-2 -30)"/>
      <!-- leaf in the corner, pointing up -->
      <use href="#abLeaf" width="120" height="60" transform="translate(6 132) rotate(-68) scale(1.15) translate(-2 -30)"/>
      <!-- middle leaf, almost level -->
      <use href="#abLeaf" width="120" height="60" transform="translate(62 128) rotate(-4) scale(.92) translate(-2 -30)"/>
      <!-- lower leaf hanging down -->
      <use href="#abLeaf" width="120" height="60" transform="translate(8 148) rotate(66) scale(.72) translate(-2 -30)"/>
    </g>
    <g fill="url(#abLeafLight)">
      <use href="#abLeaf" width="120" height="60" transform="translate(80 74) rotate(-80) scale(.6) translate(-2 -30)"/>
    </g>
  </svg>

  <!-- Single loose leaves -->
  <svg class="float-leaf float-leaf--1" viewBox="0 0 120 60"><use href="#abLeaf" fill="url(#abLeafDark)"/></svg>
  <svg class="float-leaf float-leaf--2" viewBox="0 0 120 60"><use href="#abLeaf" fill="url(#abLeafDark)"/></svg>
  <svg class="float-leaf float-leaf--3" viewBox="0 0 120 60"><use href="#abLeaf" fill="url(#abLeafDark)"/></svg>
  <svg class="float-leaf float-leaf--4" viewBox="0 0 120 60"><use href="#abLeaf" fill="url(#abLeafLight)"/></svg>

  <!-- Faded leaves at the right edge -->
  <svg class="ghost-leaves" viewBox="0 0 200 220">
    <g fill="#cfe3da" fill-opacity=".55">
      <use href="#abLeaf" width="120" height="60" transform="translate(210 40) rotate(200) scale(1.1) translate(-2 -30)"/>
      <use href="#abLeaf" width="120" height="60" transform="translate(212 120) rotate(165) scale(1.25) translate(-2 -30)"/>
      <use href="#abLeaf" width="120" height="60" transform="translate(205 190) rotate(215) scale(.9) translate(-2 -30)"/>
    </g>
  </svg>

  <!-- Brand message (right side) -->
  <div class="brand-tagline">
    <span class="brand-tagline__top">Healthy Hair</span>
    <span class="brand-tagline__main">Glowing Skin</span>
    <span class="brand-tagline__rule"></span>
    <span class="brand-tagline__sub">Care Today <i></i> Confidence Tomorrow</span>
  </div>

  <!-- Bottom-right green wave with a gold edge -->
  <svg class="wave" viewBox="0 0 800 420" preserveAspectRatio="xMaxYMax meet">
    <path d="M0 420 C180 380 330 318 470 254 C600 196 700 160 800 150 L800 420Z" fill="#d3e8de" fill-opacity=".8"/>
    <path d="M170 420 C332 378 466 318 590 262 C680 222 742 208 800 204 L800 420Z" fill="url(#abWave)"/>
    <path d="M140 420 C310 372 452 312 580 256 C676 214 742 196 800 190" fill="none" stroke="#e3c98f" stroke-opacity=".85" stroke-width="2.2"/>
    <path d="M100 420 C290 362 440 300 568 246 C668 204 738 184 800 176" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.4"/>
  </svg>

  <!-- Bottom-right leafy branch over the wave -->
  <svg class="branch branch--bottom-right" viewBox="0 0 280 280">
    <!-- twig from the right edge, branching to each leaf -->
    <path d="M300 172 C276 150 248 126 217 104 M300 172 C288 160 280 150 272 140 M300 210 C288 200 274 180 260 158" fill="none" stroke="#2d6b48" stroke-opacity=".8" stroke-width="1.8" stroke-linecap="round"/>
    <g fill="url(#abLeafDark)">
      <!-- large leaf pointing up -->
      <use href="#abLeaf" width="120" height="60" transform="translate(272 140) rotate(245) scale(1.26) translate(-2 -30)"/>
      <!-- leaf reaching left -->
      <use href="#abLeaf" width="120" height="60" transform="translate(217 104) rotate(201) scale(.95) translate(-2 -30)"/>
      <!-- lower large leaf, left and down -->
      <use href="#abLeaf" width="120" height="60" transform="translate(284 214) rotate(150) scale(.9) translate(-2 -30)"/>
    </g>
    <g fill="url(#abLeafLight)">
      <use href="#abLeaf" width="120" height="60" transform="translate(260 158) rotate(174) scale(.78) translate(-2 -30)"/>
    </g>
  </svg>

  <!-- Mint medical crosses -->
  <span class="plus plus--tr-1"></span>
  <span class="plus plus--tr-2"></span>
  <span class="plus plus--bl-1"></span>
  <span class="plus plus--bl-2"></span>
</div>
