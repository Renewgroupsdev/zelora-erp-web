<div class="app-layout" [class.horizontal-layout]="navLayout.layoutMode() === 'horizontal'">
  <app-top-navbar></app-top-navbar>

  @if (navLayout.layoutMode() === 'vertical') {
    <div class="layout-body vertical-body">
      <app-left-side-navbar></app-left-side-navbar>
      <main class="layout-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  } @else {
    <div class="horizontal-nav-wrap">
      <app-left-side-navbar></app-left-side-navbar>
    </div>
    <main class="layout-content horizontal-content">
      <router-outlet></router-outlet>
    </main>
  }

  <!-- Incoming call popup, live call bar and telecaller presence - on every page. -->
  <app-telephony-dock></app-telephony-dock>
</div>
