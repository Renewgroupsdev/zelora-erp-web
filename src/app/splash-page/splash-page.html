<main class="splash-wrapper">
  <app-auth-background></app-auth-background>

  <div class="splash-stack">
    <section class="splash-card" aria-label="Renew Plus welcome">
      <div class="logo-shell">
        <img src="assets/Renew-plus-logo.jpg" alt="Renew Plus Hair and Skin Care" class="splash-logo" />
      </div>

      <!-- <h1 class="splash-title">Welcome to <span>Renew+</span></h1>
      <p class="splash-subtitle">Hair &amp; Skin Care Management</p> -->

      <a routerLink="/login" class="splash-cta-btn" (click)="$event.stopPropagation()">
        <span>Continue to Login</span>
        <i class="bi bi-arrow-right" aria-hidden="true"></i>
      </a>

      <div class="splash-trust-row" aria-label="Secure, easy and trusted">
        <span class="trust-line"></span>
        <span class="trust-text"><i class="bi bi-lock-fill" aria-hidden="true"></i><span>Secure &bull; Easy &bull; Trusted</span></span>
        <span class="trust-line"></span>
      </div>
    </section>

    <div class="page-features" aria-hidden="true">
      <div class="page-feature-item">
        <span class="page-feature-icon"><i class="bi bi-leaf"></i></span>
        <span class="page-feature-label">Better Care<br />For You</span>
      </div>
      <span class="page-feature-divider"></span>
      <div class="page-feature-item">
        <span class="page-feature-icon"><i class="bi bi-shield-plus"></i></span>
        <span class="page-feature-label">Trusted<br />Healthcare</span>
      </div>
      <span class="page-feature-divider"></span>
      <div class="page-feature-item">
        <span class="page-feature-icon"><i class="bi bi-heart"></i></span>
        <span class="page-feature-label">Healthy<br />Tomorrow</span>
      </div>
    </div>
  </div>
</main>
