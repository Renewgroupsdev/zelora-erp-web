<main class="splash-wrapper" (click)="goToLogin()">

  <div class="splash-bg" aria-hidden="true">
    <span class="bg-blob"></span>

    <svg class="splash-waves" viewBox="0 0 400 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="splashWaveGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5fd39c"></stop>
          <stop offset="45%" stop-color="#3cb9a8"></stop>
          <stop offset="100%" stop-color="#3d97c9"></stop>
        </linearGradient>
        <linearGradient id="splashWaveGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2fb673"></stop>
          <stop offset="45%" stop-color="#1c9a86"></stop>
          <stop offset="100%" stop-color="#0878b8"></stop>
        </linearGradient>
      </defs>
      <path class="wave wave-1" d="M0,55 C60,110 90,175 130,165 C180,150 200,90 250,55 C300,25 350,10 400,20 L400,300 L0,300 Z"></path>
      <path class="wave wave-2" d="M0,278 C60,270 110,230 170,190 C230,150 260,90 320,45 C355,22 380,8 400,0 L400,300 L0,300 Z"></path>
    </svg>

    <div class="wave-plus-overlay">
      <svg class="plus-mark plus-mark--filled" style="left:6%; top:86%; width:46px; height:46px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled plus-mark--upper" style="left:19%; top:53%; width:30px; height:30px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled" style="left:38%; top:68%; width:56px; height:56px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled plus-mark--upper" style="left:50%; top:50%; width:32px; height:32px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled" style="left:68%; top:91%; width:64px; height:64px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled plus-mark--upper" style="left:85%; top:35%; width:74px; height:74px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled" style="left:94%; top:70%; width:46px; height:46px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
    </div>
  </div>

  <div class="corner-leaf" aria-hidden="true">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,10 C50,0 90,30 100,80 C70,60 40,55 0,70 Z" fill="#bfe3d4" opacity="0.85"></path>
      <path d="M0,40 C40,35 70,60 78,110 C50,95 25,95 0,110 Z" fill="#8fd0bb" opacity="0.75"></path>
      <path d="M0,75 C30,75 55,95 60,130 C35,120 15,122 0,135 Z" fill="#5fc0a8" opacity="0.6"></path>
    </svg>
  </div>

  <div class="corner-tagline" aria-hidden="true">
    <span class="corner-tagline-text">Healthy Hair<br>Glowing Skin</span>
    <svg class="corner-tagline-swash" viewBox="0 0 140 14" preserveAspectRatio="none"><path d="M2,8 C40,14 100,14 138,4"></path></svg>
  </div>

  <div class="splash-stack">

    <section class="splash-content" aria-label="Renew Plus welcome">

      <div class="logo-shell">
        <img src="assets/Renew-plus-logo.jpg" alt="Renew Plus Hair and Skin Care" class="splash-logo">
      </div>

      <a routerLink="/login" class="splash-cta-btn" (click)="$event.stopPropagation()">
        <span>Continue to Login</span>
        <i class="bi bi-arrow-right"></i>
      </a>

      <div class="splash-trust-row">
        <span class="trust-line"></span>
        <span class="trust-text"><i class="bi bi-lock-fill"></i> Secure &bull; Easy &bull; Trusted</span>
        <span class="trust-line"></span>
      </div>
    </section>

    <div class="page-features" aria-hidden="true">
      <div class="page-feature-item">
        <span class="page-feature-icon"><i class="bi bi-leaf"></i></span>
        <span class="page-feature-label">Better Care<br>For You</span>
      </div>
      <span class="page-feature-divider"></span>
      <div class="page-feature-item">
        <span class="page-feature-icon"><i class="bi bi-shield-plus"></i></span>
        <span class="page-feature-label">Trusted<br>Healthcare</span>
      </div>
      <span class="page-feature-divider"></span>
      <div class="page-feature-item">
        <span class="page-feature-icon"><i class="bi bi-heart"></i></span>
        <span class="page-feature-label">Healthy<br>Tomorrow</span>
      </div>
    </div>

  </div>

</main>
