<div class="auth-wrapper">

  <div class="auth-bg" aria-hidden="true">
    <span class="bg-blob"></span>

    <svg class="auth-waves" viewBox="0 0 400 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="forgotWaveGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5fd39c"></stop>
          <stop offset="45%" stop-color="#3cb9a8"></stop>
          <stop offset="100%" stop-color="#3d97c9"></stop>
        </linearGradient>
        <linearGradient id="forgotWaveGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2fb673"></stop>
          <stop offset="45%" stop-color="#1c9a86"></stop>
          <stop offset="100%" stop-color="#0878b8"></stop>
        </linearGradient>
      </defs>
      <path class="wave wave-1" d="M0,55 C60,110 90,175 130,165 C180,150 200,90 250,55 C300,25 350,10 400,20 L400,300 L0,300 Z"></path>
      <path class="wave wave-2" d="M0,278 C60,270 110,230 170,190 C230,150 260,90 320,45 C355,22 380,8 400,0 L400,300 L0,300 Z"></path>
    </svg>

    <div class="wave-plus-overlay">
      <svg class="plus-mark plus-mark--filled" style="left:6%; top:86%; width:46px; height:46px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled" style="left:19%; top:53%; width:30px; height:30px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled" style="left:38%; top:68%; width:56px; height:56px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled" style="left:50%; top:50%; width:32px; height:32px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled" style="left:68%; top:91%; width:64px; height:64px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled" style="left:85%; top:35%; width:74px; height:74px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
      <svg class="plus-mark plus-mark--filled" style="left:94%; top:70%; width:46px; height:46px;" viewBox="0 0 24 24"><polygon points="9,3 15,3 15,9 21,9 21,15 15,15 15,21 9,21 9,15 3,15 3,9 9,9"></polygon></svg>
    </div>
  </div>

  <div class="form-panel">
    <div class="auth-card">

      <div class="auth-logo-block">
        <img src="assets/Renew-plus-logo.jpg" alt="Renew Plus logo" class="auth-logo">
      </div>

      <h2 class="welcome-text">Forgot password?</h2>
      <p class="welcome-subtext">Enter your email and we'll send you a reset link</p>

      <!-- Inline error message -->
      <div class="alert-error" *ngIf="error" role="alert">
        <span class="alert-icon">!</span>
        <span class="alert-message">{{ error }}</span>
        <button type="button" class="alert-close" (click)="clearError()" aria-label="Dismiss">&times;</button>
      </div>

      <!-- Inline success message -->
      <div class="alert-success" *ngIf="successMessage" role="status">
        <span class="alert-message">{{ successMessage }}</span>
      </div>

      <form name="forgot-password-form" class="login-form" [formGroup]="forgotForm">

        @if(loading){
           <app-preloader [display]="loading"></app-preloader>
        }

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-icon"><i class="bi bi-envelope"></i></span>
            <input
              class="form-control"
              type="email"
              id="email"
              autocomplete="off"
              placeholder="Enter your registered email"
              formControlName="email"
              [ngClass]="{ 'is-invalid': formSubmitted && formValues['email'].invalid }"
            >
          </div>
          <div *ngIf="formSubmitted && formValues['email'].invalid" class="invalid-feedback">
            <div *ngIf="formValues['email'].errors?.['required']">Email is required.</div>
            <div *ngIf="formValues['email'].errors?.['email']">Please enter a valid email address.</div>
          </div>
        </div>

        <div class="submit-row">
          <button class="btn btn-primary" type="button" (click)="onSubmit()" [disabled]="loading">
            <span *ngIf="!loading">Send Reset Link</span>
            <span *ngIf="loading">Sending...</span>
          </button>
        </div>

        <div class="back-to-login-row">
          <a href="javascript:void(0)" (click)="backToLogin()">&larr; Back to Log In</a>
        </div>

      </form>

      <div class="auth-footer"> &copy; 2026 Renew Plus Hair and Skin Care pvt ltd</div>
    </div>
  </div>

</div>
