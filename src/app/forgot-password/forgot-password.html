<div class="auth-wrapper">

  <app-auth-background></app-auth-background>

  <div class="form-panel">
    <div class="auth-card">

      <div class="auth-logo-block">
        <img src="assets/Renew-plus-logo.jpg" alt="Renew Plus logo" class="auth-logo">
      </div>

      <h2 class="welcome-text">Forgot password?</h2>
      <p class="welcome-subtext">Enter your email and we'll send you a reset link</p>

      <!-- Inline error message -->
      <div class="alert-error" *ngIf="error" role="alert">
        <span class="alert-icon">!</span>
        <span class="alert-message">{{ error }}</span>
        <button type="button" class="alert-close" (click)="clearError()" aria-label="Dismiss">&times;</button>
      </div>

      <!-- Inline success message -->
      <div class="alert-success" *ngIf="successMessage" role="status">
        <span class="alert-message">{{ successMessage }}</span>
      </div>

      <form name="forgot-password-form" class="login-form" [formGroup]="forgotForm">

        @if(loading){
           <app-preloader [display]="loading"></app-preloader>
        }

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-icon"><i class="bi bi-envelope"></i></span>
            <input
              class="form-control"
              type="email"
              id="email"
              autocomplete="off"
              placeholder="Enter your registered email"
              formControlName="email"
              [ngClass]="{ 'is-invalid': formSubmitted && formValues['email'].invalid }"
            >
          </div>
          <div *ngIf="formSubmitted && formValues['email'].invalid" class="invalid-feedback">
            <div *ngIf="formValues['email'].errors?.['required']">Email is required.</div>
            <div *ngIf="formValues['email'].errors?.['email']">Please enter a valid email address.</div>
          </div>
        </div>

        <div class="submit-row">
          <button class="btn btn-primary" type="button" (click)="onSubmit()" [disabled]="loading">
            <span *ngIf="!loading">Send Reset Link</span>
            <span *ngIf="loading">Sending...</span>
          </button>
        </div>

        <div class="back-to-login-row">
          <a href="javascript:void(0)" (click)="backToLogin()">&larr; Back to Log In</a>
        </div>

      </form>

      <div class="auth-footer"> &copy; 2026 Renew Plus Hair and Skin Care pvt ltd</div>
    </div>
  </div>

  <div class="page-features" aria-hidden="true">
    <div class="page-feature-item">
      <span class="page-feature-icon"><i class="bi bi-leaf"></i></span>
      <span class="page-feature-label">Better Care<br>For You</span>
    </div>
    <span class="page-feature-divider"></span>
    <div class="page-feature-item">
      <span class="page-feature-icon"><i class="bi bi-shield-plus"></i></span>
      <span class="page-feature-label">Trusted<br>Healthcare</span>
    </div>
    <span class="page-feature-divider"></span>
    <div class="page-feature-item">
      <span class="page-feature-icon"><i class="bi bi-heart"></i></span>
      <span class="page-feature-label">Healthy<br>Tomorrow</span>
    </div>
  </div>

</div>
